<h2>Collections</h2>

<p>Recordings and documents from the
  <a href="https://digital.library.unt.edu/explore/collections/CORSAL/">CoRSAL archive</a>.
  Select a title to open the item in the archive.</p>

<div id="items">
  <div class="row g-2 mb-3 align-items-center">
    <div class="col-12 col-md-5">
      <input type="search" class="form-control" id="items-q" placeholder="Search title, creator, description&hellip;" aria-label="Search items">
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select" id="items-lang" aria-label="Language"><option value="">All languages</option></select>
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select" id="items-type" aria-label="Type"><option value="">All types</option></select>
    </div>
    <div class="col-12 col-md-3 text-md-end small text-muted" id="items-count" aria-live="polite"></div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr><th>Title</th><th>Language</th><th>Type</th><th>Creator</th><th>Date</th><th>Listen / watch</th></tr>
      </thead>
      <tbody>
{{ITEMS}}
      </tbody>
    </table>
  </div>

  <nav class="d-flex flex-wrap justify-content-between align-items-center gap-2" aria-label="Pages">
    <label class="small text-muted d-flex align-items-center gap-2">Rows per page
      <select class="form-select form-select-sm w-auto" id="items-size">
        <option>10</option><option selected>25</option><option>50</option>
      </select>
    </label>
    <ul class="pagination pagination-sm mb-0" id="items-pages"></ul>
  </nav>
</div>

<script src="assets/items.js"></script>
